text: |
  `/hero-set <displayName> <audioFileName>` speichert ein DisplayName→Audio-Mapping. Der audioFileName kann mit oder ohne Dateiendung angegeben werden (case-insensitive). Bei Namens-Duplikaten wird der User aufgefordert, den vollständigen Dateinamen anzugeben. Die Datei wird im festen Verzeichnis `<plugin-dir>/music/` gesucht.
