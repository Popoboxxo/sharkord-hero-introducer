text: |
  Wenn ein User einem Voice-Channel beitritt (`voice:user_joined`-Event), wird anhand des `username` aus dem Event (oder aus dem User-Cache) in der MusicMap nach einem passenden Eintrag gesucht. Existiert ein Mapping, wird der Audio-Pfad als `path.join(pluginDir, "music", audioFileName)` aufgelöst. Nach einer konfigurierbaren Verzögerung (`INTRO_DELAY_MS`, Default 5000 ms) wird das Intro automatisch im Event-Channel (`channelId`) abgespielt. Das Plugin unterstützt `.mp3` und `.mpeg` Dateien.
traceability: src/server.ts
