name: issue-auto-analysis

on:
  issues:
    types:
      - opened
      - reopened

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Analyze issue safely
        id: analyze
        env:
          ANALYSIS_OUTPUT_PATH: ${{ runner.temp }}/issue-analysis.json
        run: bun scripts/github-autofix/analyze-issue.ts

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue-analysis-${{ steps.analyze.outputs.issue_number }}
          path: ${{ steps.analyze.outputs.analysis_path }}
          if-no-files-found: error